[package]
name = "chatgpt-exec-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
description = "A stdio MCP server for shell commands with optional stateful PTY sessions"
readme = "README.md"
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
codex-utils-pty = { path = "vendor/codex-utils-pty" }
rand = "0.9"
libc = "0.2"
rmcp = { version = "=3.1.3", default-features = false, features = [
    "server",
    "transport-async-rw",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = "symbols"
