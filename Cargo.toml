[package]
name = "chatgpt-exec-mcp"
version = "0.2.0"
edition = "2024"
rust-version = "1.88"
license = "Apache-2.0"
description = "An MCP server for shell commands, stateful PTYs, and multi-agent pools"
readme = "README.md"
publish = false

[workspace]
members = ["vendor/codex-utils-pty"]
default-members = ["."]
resolver = "3"

[dependencies]
anyhow = "1"
codex-utils-pty = { path = "vendor/codex-utils-pty" }
rand = "0.9"
libc = "0.2"
rmcp = { version = "=3.5.0", default-features = false, features = [
    "server",
    "macros",
    "transport-async-rw",
    "transport-streamable-http-server",
] }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio"] }
rusqlite = { version = "0.37", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
    "io-std",
    "io-util",
    "macros",
    "net",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[profile.release]
lto = "thin"
strip = "symbols"
