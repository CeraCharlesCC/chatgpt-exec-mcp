<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Exec MCP Debug</title>
<style>
:root{color-scheme:dark;--bg:#0d1117;--panel:#161b22;--panel2:#0f141b;--border:#30363d;--text:#e6edf3;--muted:#8b949e;--accent:#2f81f7;--good:#3fb950;--warn:#d29922;--bad:#f85149;--shadow:0 10px 30px rgba(0,0,0,.22)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.45 ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select,textarea{font:inherit;color:inherit}.shell{min-height:100vh;display:grid;grid-template-rows:52px 1fr}.top{display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--border);background:rgba(13,17,23,.92);backdrop-filter:blur(8px);position:sticky;top:0;z-index:10}.brand{display:flex;gap:10px;align-items:center;font-weight:650}.badge{font-size:11px;color:var(--muted);border:1px solid var(--border);padding:2px 7px;border-radius:999px}.status{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:var(--good);box-shadow:0 0 0 3px rgba(63,185,80,.12)}.grid{display:grid;grid-template-columns:290px minmax(0,1fr) 340px;gap:12px;padding:12px;min-height:0}.panel{border:1px solid var(--border);background:var(--panel);border-radius:10px;box-shadow:var(--shadow);min-width:0;overflow:hidden}.panel h2{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--border);font-weight:650}.section{padding:12px}.pool{border:1px solid var(--border);border-radius:8px;overflow:hidden;margin-bottom:10px}.pool-title{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:var(--panel2);font-weight:600}.agent{padding:9px 10px;border-top:1px solid var(--border);display:grid;grid-template-columns:1fr auto;gap:8px}.agent-name{display:flex;align-items:center;gap:7px}.agent-meta{color:var(--muted);font-size:11px;margin-top:2px}.tiny-dot{width:7px;height:7px;border-radius:50%;background:var(--good)}button{border:1px solid var(--border);background:#21262d;border-radius:6px;padding:6px 9px;cursor:pointer}button:hover{border-color:#57606a;background:#292e36}.danger{color:#ffb4b4}.danger:hover{border-color:var(--bad);background:rgba(248,81,73,.08)}.tabs{display:flex;gap:4px;padding:8px;border-bottom:1px solid var(--border);background:var(--panel2)}.tab{border-color:transparent;background:transparent;color:var(--muted)}.tab.active{color:var(--text);background:#21262d;border-color:var(--border)}.events{height:calc(100vh - 126px);overflow:auto;padding:10px}.event{border:1px solid var(--border);border-radius:8px;margin-bottom:8px;background:#10151c}.event-head{display:flex;justify-content:space-between;gap:12px;padding:8px 10px;border-bottom:1px solid rgba(48,54,61,.7)}.event-kind{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px}.event-time,.muted{color:var(--muted)}.chips{display:flex;flex-wrap:wrap;gap:5px;padding:0 10px 8px}.chip{font-size:11px;color:#c9d1d9;background:#21262d;border:1px solid var(--border);padding:2px 6px;border-radius:999px}.event pre,.logline pre{white-space:pre-wrap;word-break:break-word;margin:0;padding:9px 10px;color:#c9d1d9;font:11.5px/1.45 ui-monospace,SFMono-Regular,Consolas,monospace;max-height:260px;overflow:auto}.lvl-error{border-left:3px solid var(--bad)}.lvl-warn{border-left:3px solid var(--warn)}.form-row{display:grid;gap:6px;margin-bottom:9px}label{font-size:11px;color:var(--muted)}input,select,textarea{width:100%;background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:7px 8px;outline:none}textarea{min-height:82px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(47,129,247,.12)}.send-btn{background:#238636;border-color:#2ea043;width:100%;font-weight:600}.send-btn:hover{background:#2ea043;border-color:#3fb950}.inbox{max-height:40vh;overflow:auto}.message{border:1px solid var(--border);border-radius:8px;padding:9px;margin-bottom:8px}.message-head{display:flex;justify-content:space-between;gap:8px;font-size:11px;color:var(--muted);margin-bottom:5px}.empty{color:var(--muted);padding:14px;text-align:center}.toast{position:fixed;right:18px;bottom:18px;padding:9px 12px;border:1px solid var(--border);background:#21262d;border-radius:8px;box-shadow:var(--shadow);opacity:0;transform:translateY(5px);transition:.15s;pointer-events:none}.toast.show{opacity:1;transform:none}.toast.bad{border-color:var(--bad)}.logline{border-bottom:1px solid rgba(48,54,61,.5);padding:7px 9px}.logmeta{font:11px ui-monospace,SFMono-Regular,Consolas,monospace;color:var(--muted)}@media(max-width:1100px){.grid{grid-template-columns:260px 1fr}.right{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr}.events{height:65vh}}@media(max-width:760px){.grid{grid-template-columns:1fr}.right{display:block}.events{height:auto;max-height:70vh}.top{padding:0 10px}}
</style>
</head>
<body>
<div class="shell">
  <header class="top"><div class="brand">Exec MCP <span class="badge">debug console</span></div><div class="status"><span class="dot"></span><span id="status">connecting</span></div></header>
  <main class="grid">
    <aside class="panel"><h2>Agent pools</h2><div class="section" id="pools"><div class="empty">No active agents</div></div></aside>
    <section class="panel"><div class="tabs"><button class="tab active" data-view="activity">Activity</button><button class="tab" data-view="logs">MCP log</button></div><div class="events" id="events"></div></section>
    <aside class="panel right"><div><h2>Send as admin</h2><div class="section"><div class="form-row"><label>Pool</label><select id="poolSelect"></select></div><div class="form-row"><label>Target</label><select id="targetSelect"></select></div><div class="form-row"><label>Message</label><textarea id="message" placeholder="Message delivered on the agent's next tool call"></textarea></div><button id="send" class="send-btn">Send message</button></div></div><div><h2>Admin inbox</h2><div class="section inbox" id="inbox"><div class="empty">No messages</div></div></div></aside>
  </main>
</div><div id="toast" class="toast"></div>
<script>
const state={data:null,view:'activity'};const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function ago(ms){const d=Math.max(0,Date.now()-ms),s=Math.floor(d/1000);if(s<60)return s+'s ago';const m=Math.floor(s/60);if(m<60)return m+'m ago';const h=Math.floor(m/60);return h+'h ago'}function left(ms){const s=Math.max(0,Math.floor((ms-Date.now())/1000));if(s<60)return s+'s remaining';const m=Math.floor(s/60);if(m<60)return m+'m remaining';return Math.floor(m/60)+'h remaining'}
function toast(msg,bad=false){const t=$('#toast');t.textContent=msg;t.className='toast show'+(bad?' bad':'');clearTimeout(t._x);t._x=setTimeout(()=>t.className='toast',2200)}
function renderPools(){const root=$('#pools'),pools=state.data?.pools||[];root.innerHTML=pools.length?'':'<div class="empty">No active agents</div>';for(const p of pools){const box=document.createElement('div');box.className='pool';box.innerHTML=`<div class="pool-title"><span>${esc(p.name)}</span><span class="muted">${p.agents.length}</span></div>`;for(const a of p.agents){const row=document.createElement('div');row.className='agent';row.innerHTML=`<div><div class="agent-name"><span class="tiny-dot"></span><strong>${esc(a.agent)}</strong></div><div class="agent-meta">seen ${ago(a.last_seen_ms)} · lease ${left(a.expires_ms)}</div></div><button class="danger">Terminate</button>`;row.querySelector('button').onclick=()=>terminate(p.name,a.agent);box.appendChild(row)}root.appendChild(box)}renderTargets()}
function renderTargets(){const pools=state.data?.pools||[],ps=$('#poolSelect'),ts=$('#targetSelect'),oldp=ps.value,oldt=ts.value;ps.innerHTML=pools.map(p=>`<option>${esc(p.name)}</option>`).join('');if([...ps.options].some(o=>o.value===oldp))ps.value=oldp;const p=pools.find(x=>x.name===ps.value);const targets=['global',...(p?.agents||[]).map(a=>a.agent)];ts.innerHTML=targets.map(x=>`<option>${esc(x)}</option>`).join('');if([...ts.options].some(o=>o.value===oldt))ts.value=oldt}
function renderInbox(){const root=$('#inbox'),msgs=state.data?.admin_messages||[];root.innerHTML=msgs.length?'':'<div class="empty">No messages</div>';for(const m of msgs){const d=document.createElement('div');d.className='message';d.innerHTML=`<div class="message-head"><span>${esc(m.from)} · ${esc(m.pool)}</span><span>${ago(m.created_ms)}</span></div><div>${esc(m.message)}</div>`;root.appendChild(d)}}
function eventAgents(e){return (e.agents||[]).map(a=>`<span class="chip">${esc(a.pool)}/${esc(a.agent)}</span>`).join('')}
function renderEvents(){const root=$('#events'),events=[...(state.data?.events||[])].reverse();if(state.view==='logs'){root.innerHTML=events.map(e=>`<div class="logline"><div class="logmeta">${new Date(e.timestamp_ms).toLocaleTimeString()} [${esc(e.level)}] ${esc(e.kind)}${e.session?' session='+esc(e.session):''}</div><pre>${esc(JSON.stringify(e.detail,null,2))}</pre></div>`).join('')||'<div class="empty">No log entries</div>';return}root.innerHTML=events.map(e=>`<article class="event lvl-${esc(e.level)}"><div class="event-head"><span class="event-kind">${esc(e.kind)}</span><span class="event-time">${ago(e.timestamp_ms)}</span></div>${e.agents?.length?`<div class="chips">${eventAgents(e)}</div>`:''}<pre>${esc(JSON.stringify(e.detail,null,2))}</pre></article>`).join('')||'<div class="empty">No activity yet</div>'}
async function terminate(pool,agent){if(!confirm(`Terminate ${agent} from ${pool}?`))return;try{const r=await fetch('/_admin/api/terminate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pool,agent})});if(!r.ok)throw new Error(await r.text());toast('Membership terminated');await refresh()}catch(e){toast(e.message,true)}}
async function send(){const pool=$('#poolSelect').value,target=$('#targetSelect').value,message=$('#message').value;if(!pool||!target||!message.trim())return toast('Pool, target and message are required',true);try{const r=await fetch('/_admin/api/send',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({pool,target,message})});if(!r.ok)throw new Error(await r.text());const x=await r.json();$('#message').value='';toast(`Delivered to ${(x.recipients||[]).length} recipient(s)`);await refresh()}catch(e){toast(e.message,true)}}
async function refresh(){try{const r=await fetch('/_admin/api/snapshot',{cache:'no-store'});if(!r.ok)throw new Error(await r.text());state.data=await r.json();$('#status').textContent=`v${state.data.version} · up ${Math.floor(state.data.uptime_seconds/60)}m`;renderPools();renderInbox();renderEvents()}catch(e){$('#status').textContent='disconnected';toast(e.message,true)}}
$('#poolSelect').onchange=renderTargets;$('#send').onclick=send;document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');state.view=b.dataset.view;renderEvents()});refresh();setInterval(refresh,1500);
</script>
</body>
</html>
