name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  release:
    if: github.repository == 'CeraCharlesCC/chatgpt-exec-mcp'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag is on main
        run: |
          if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
            echo '::error::Release tags must point to a commit on main'
            exit 1
          fi
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy --component rustfmt
          rustup override set 1.93.1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Test and lint
        run: |
          cargo fmt --all --check
          cargo test --workspace --all-targets --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Prepare release files
        run: |
          python3 scripts/build-standalone.py --output dist/chatgpt-exec-mcp-linux-x86_64
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/
      - name: Attest binary
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/chatgpt-exec-mcp-linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatgpt-exec-mcp-linux-x86_64
          path: dist/
          if-no-files-found: error
      - name: Publish tagged release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" dist/chatgpt-exec-mcp-linux-x86_64 \
            dist/LICENSE dist/NOTICE dist/THIRD_PARTY_NOTICES.md --verify-tag --generate-notes
