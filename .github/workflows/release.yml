name: Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy
          rustup override set 1.93.1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Test and lint
        run: |
          cargo test --all-targets --locked --offline
          cargo clippy --all-targets --locked --offline -- -D warnings
      - name: Build standalone binary
        run: python3 scripts/build-standalone.py --output dist/chatgpt-exec-mcp-linux-x86_64
      - name: Attest binary
        if: github.event_name != 'pull_request' && github.repository == 'CeraCharlesCC/chatgpt-exec-mcp'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/chatgpt-exec-mcp-linux-x86_64
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatgpt-exec-mcp-linux-x86_64
          path: dist/chatgpt-exec-mcp-linux-x86_64
          if-no-files-found: error
      - name: Publish tagged release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && github.repository == 'CeraCharlesCC/chatgpt-exec-mcp'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/chatgpt-exec-mcp-linux-x86_64 --verify-tag --generate-notes
