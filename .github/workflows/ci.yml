name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install fixed Rust toolchain
        run: |
          rustup toolchain install 1.93.1 --profile minimal --component clippy
          rustup override set 1.93.1
      - name: Fetch locked dependencies
        run: cargo fetch --locked
      - name: Require optional fixture tools used by vendor tests
        run: |
          test -x /usr/bin/python3
          python3 --version
          command -v setsid
          setsid true
      - name: Test and lint
        run: |
          cargo test --workspace --all-targets --locked --offline
          cargo clippy --workspace --all-targets --locked --offline -- -D warnings
      - name: Prepare build files
        run: |
          python3 scripts/build-standalone.py --output dist/chatgpt-exec-mcp-linux-x86_64
          cp LICENSE NOTICE THIRD_PARTY_NOTICES.md dist/
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: chatgpt-exec-mcp-linux-x86_64
          path: dist/
          if-no-files-found: error

  webui:
    name: WebUI browser and model tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tests/webui
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24.20.0'
          cache: npm
          cache-dependency-path: tests/webui/package-lock.json
      - name: Install browser test dependencies
        run: npm ci
      - name: Install Playwright Chromium and system libraries
        run: npx playwright install --with-deps chromium
      - name: Run browser and pure-model regression suites
        run: npm test
